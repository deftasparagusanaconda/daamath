not:
  description: negation
  syntax: ¬a
  signatures:
    boolean:
      domains:
        - a: boolean
      codomain: boolean

and:
  description: conjunction
  syntax: a ∧ b
  signatures:
    boolean:
      domains:
        - a: boolean
        - b: boolean
      codomain: boolean

or:
  description: disjunction 
  syntax: a ∨ b
  signatures:
    boolean:
      domains:
        - a: boolean
        - b: boolean
      codomain: boolean

xor:
  description: exclusive disjunction
  signatures:
    boolean:
      domains:
        - a: boolean
        - b: boolean
      codomain: boolean

imp:
  description: material implication
  syntax: a → b
  signatures:
    boolean:
      domains:
        - a: boolean
        - b: boolean
      codomain: boolean

con:
  description: converse material implication
  syntax: a ← b
  signatures:
    boolean:
      domains:
        - a: boolean
        - b: boolean
      codomain: boolean

nand:
  description: not(and)
  signatures:
    boolean:
      domains:
        - a: boolean
        - b: boolean
      codomain: boolean

nor:
  description: not(or)
  signatures:
    boolean:
      domains:
        - a: boolean
        - b: boolean
      codomain: boolean

nxor:
  description: not(xor)
  signatures:
    boolean:
      domains:
        - a: boolean
        - b: boolean
      codomain: boolean

nimp:
  description: not(imp)
  signatures:
    boolean:
      domains:
        - a: boolean
        - b: boolean
      codomain: boolean

ncon:
  description: not(ncon)
  signatures:
    boolean:
      domains:
        - a: boolean
        - b: boolean
      codomain: boolean
